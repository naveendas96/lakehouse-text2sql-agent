[project]
name = "lakehouse-text2sql-agent"
version = "0.1.0"
description = "Governed text-to-SQL agent: semantic layer, SQL guardrails, self-correction, DuckDB + Snowflake/Databricks adapters."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["duckdb>=1.0", "sqlglot>=25", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3"]
databricks = ["databricks-sql-connector>=3"]
dev = ["pytest>=8"]

[project.scripts]
t2s = "t2s.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
