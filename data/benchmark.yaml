- q: "total revenue"
  gold: "SELECT SUM(net_amount) FROM fact_sales"
- q: "revenue by region"
  gold: "SELECT s.region, SUM(f.net_amount) FROM fact_sales f JOIN dim_store s USING (store_key) GROUP BY 1"
- q: "units sold by category"
  gold: "SELECT p.category, SUM(f.quantity) FROM fact_sales f JOIN dim_product p USING (product_key) GROUP BY 1"
- q: "revenue by year"
  gold: "SELECT d.year, SUM(f.net_amount) FROM fact_sales f JOIN dim_date d USING (date_key) GROUP BY 1"
- q: "number of orders by loyalty tier"
  gold: "SELECT c.loyalty_tier, COUNT(DISTINCT sale_id) FROM fact_sales f JOIN dim_customer c USING (customer_key) GROUP BY 1"
- q: "revenue by category in 2025"
  gold: "SELECT p.category, SUM(f.net_amount) FROM fact_sales f JOIN dim_product p USING (product_key) JOIN dim_date d USING (date_key) WHERE d.year=2025 GROUP BY 1"
- q: "top 5 stores by revenue"
  gold: "SELECT s.store_name, SUM(f.net_amount) r FROM fact_sales f JOIN dim_store s USING (store_key) GROUP BY 1 ORDER BY r DESC LIMIT 5"
- q: "discount by brand for electronics"
  gold: "SELECT p.brand, SUM(f.discount_amount) FROM fact_sales f JOIN dim_product p USING (product_key) WHERE p.category='Electronics' GROUP BY 1"
- q: "average order value by segment"
  gold: "SELECT c.segment, SUM(net_amount)/COUNT(DISTINCT sale_id) FROM fact_sales f JOIN dim_customer c USING (customer_key) GROUP BY 1"
- q: "quarterly sales in west"
  gold: "SELECT d.quarter, SUM(f.net_amount) FROM fact_sales f JOIN dim_date d USING (date_key) JOIN dim_store s USING (store_key) WHERE s.region='West' GROUP BY 1"
- q: "units by city for grocery in 2024"
  gold: "SELECT s.city, SUM(quantity) FROM fact_sales f JOIN dim_store s USING (store_key) JOIN dim_product p USING (product_key) JOIN dim_date d USING (date_key) WHERE p.category='Grocery' AND d.year=2024 GROUP BY 1"
- q: "revenue from gold tier customers by month"
  gold: "SELECT d.month, SUM(net_amount) FROM fact_sales f JOIN dim_customer c USING (customer_key) JOIN dim_date d USING (date_key) WHERE c.loyalty_tier='Gold' GROUP BY 1"
- q: "which region grew revenue the most from 2024 to 2025"
  gold: "SELECT s.region FROM fact_sales f JOIN dim_store s USING (store_key) JOIN dim_date d USING (date_key) GROUP BY 1 ORDER BY SUM(CASE WHEN year=2025 THEN net_amount ELSE 0 END)-SUM(CASE WHEN year=2024 THEN net_amount ELSE 0 END) DESC LIMIT 1"
- q: "share of revenue from electronics"
  gold: "SELECT SUM(CASE WHEN p.category='Electronics' THEN net_amount END)/SUM(net_amount) FROM fact_sales f JOIN dim_product p USING (product_key)"
